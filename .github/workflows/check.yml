name: Check

# Type-checks and builds the app on every push and pull request, so problems
# show up on GitHub before anything is deployed to Railway.
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      # Throwaway database, used only to check the migration files match the schema.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Points at the throwaway CI database above. Never a real database.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate Prisma schema
        run: npx prisma validate 2>&1 | tee -a check.log; exit ${PIPESTATUS[0]}
      - name: Migrations match schema
        run: >-
          npx prisma migrate diff --from-migrations prisma/migrations
          --to-schema-datamodel prisma/schema.prisma
          --shadow-database-url "$DATABASE_URL" --exit-code 2>&1 | tee -a check.log; exit ${PIPESTATUS[0]}
      - name: Type check
        run: npm run typecheck 2>&1 | tee -a check.log; exit ${PIPESTATUS[0]}
      - name: Build
        run: npm run build 2>&1 | tee -a check.log; exit ${PIPESTATUS[0]}
      - name: Show errors as annotations
        if: failure()
        run: tail -n 40 check.log | sed 's/^/::error::/'
